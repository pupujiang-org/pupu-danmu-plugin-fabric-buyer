name: Validate plugin source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install the hash-pinned SDK release for Worker checks
        run: python3 -m pip install -r worker/requirements.txt
      - name: Validate static and Worker package sources with MIT licensing
        run: python3 scripts/package_plugins.py --check
      - name: Validate schema-v2 Worker package without executing it
        run: python3 scripts/package_worker.py --check --expected-version 1.3.0
      - name: Run Worker policy parity regressions
        run: python3 -m unittest discover -s tests -v
      - name: Build data and Worker packages in runner temporary storage
        run: |
          data_version="$(python3 -c 'import json; print(json.load(open("plugins/fabric-buyer/manifest.json", encoding="utf-8"))["version"])')"
          worker_version="$(python3 -c 'import json; print(json.load(open("worker/manifest.json", encoding="utf-8"))["version"])')"
          python3 scripts/package_plugins.py --plugin fabric-buyer --output "$RUNNER_TEMP/plugin-data-dist" --expected-version "$data_version"
          python3 scripts/package_worker.py --output "$RUNNER_TEMP/plugin-worker-dist" --expected-version "$worker_version"
